<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Rohit Kumar | Full-Stack Developer Portfolio</title>
    <meta name="description" content="Rohit Kumar - Full-Stack Developer crafting fast, scalable, and visually captivating web applications with React, Node.js, and modern tech." />
    <meta name="theme-color" content="#08090d" />

    <!-- Open Graph / Social Sharing -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Rohit Kumar | Full-Stack Developer Portfolio" />
    <meta property="og:description" content="Explore featured full-stack projects, interactive frontend experiences, and production applications." />
    <meta property="og:image" content="/rohit-saini.png" />

    <!-- Performance: Preconnect & DNS Prefetch to Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="dns-prefetch" href="https://fonts.googleapis.com" />
    <link rel="dns-prefetch" href="https://fonts.gstatic.com" />

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="alternate icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" href="/favicon.svg" />
    <script>
      (function () {
        try {
          var saved = localStorage.getItem('portfolio-theme-v2');
          if (saved === 'dark') {
            document.documentElement.setAttribute('data-theme', 'dark');
          } else {
            document.documentElement.setAttribute('data-theme', 'light');
          }
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'light');
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
